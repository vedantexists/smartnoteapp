name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate and Stage Generated APK
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -ls
          echo "=== Directory tree of app/build ==="
          find app/build -maxdepth 4 -type d || true
          mkdir -p apk-output
          find . -name "*.apk" -exec cp -v {} apk-output/ \;
          echo "=== Contents of staged apk-output: ==="
          ls -la apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/*.apk
          if-no-files-found: error

