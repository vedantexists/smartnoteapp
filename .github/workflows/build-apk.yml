name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:clean :app:assembleDebug --no-build-cache --stacktrace --info

      - name: Locate and Stage Generated APK
        run: |
          OUTPUTS=$(ls -laR app/build/outputs 2>&1 | tr '\n' ' ; ')
          echo "::warning title=OutputsDir::${OUTPUTS:0:500}"
          APP_FILES=$(find app/build -type f | head -n 40 | tr '\n' ' ; ')
          echo "::warning title=AppBuildFiles::${APP_FILES:0:500}"
          ALL_APKS=$(find . -name "*.apk" | tr '\n' ' ; ')
          echo "::warning title=AllApks::${ALL_APKS:0:500}"

          mkdir -p apk-output
          find . -name "*.apk" -exec cp -v {} apk-output/ \; || true
          echo "=== Contents of staged apk-output: ==="
          ls -la apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/*.apk
          if-no-files-found: warn

      - name: Check APK Exists
        run: |
          count=$(find apk-output -name "*.apk" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No APK found in apk-output!"
            echo "Listing all files in app/build:"
            find app/build -type f || true
            exit 1
          fi
          echo "SUCCESS: $count APK(s) found in apk-output:"
          ls -lh apk-output/*.apk

