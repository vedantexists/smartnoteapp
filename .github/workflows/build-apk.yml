name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        id: gradle_build
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Report Build Log and Workspace
        run: |
          tail -n 30 build.log | while IFS= read -r line; do
            echo "::warning title=LogTail::$line"
          done
          head -n 15 build.log | while IFS= read -r line; do
            echo "::warning title=LogHead::$line"
          done
          find . -name "*.apk" -ls | while IFS= read -r line; do
            echo "::warning title=FoundApk::$line"
          done
          find . -name "outputs" -ls | while IFS= read -r line; do
            echo "::warning title=FoundOutputs::$line"
          done

      - name: Locate and Stage Generated APK
        run: |
          mkdir -p apk-output
          find . -name "*.apk" -exec cp -v {} apk-output/ \;
          ls -la apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/*.apk
          if-no-files-found: error



