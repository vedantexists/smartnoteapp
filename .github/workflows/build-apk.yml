name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        id: gradle_build
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Check Build and Report Errors
        run: |
          if grep -q "BUILD FAILED" build.log; then
            echo "=== GRADLE FAILURE DETAILS ==="
            grep -A 25 "FAILURE: Build failed" build.log | while IFS= read -r line; do
              echo "::error title=GradleFailure::$line"
            done
            grep -E "(e: |ERROR:|> Task :app:.*FAILED)" build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=CompilerError::$line"
            done
            exit 1
          fi
          echo "Gradle build succeeded!"

      - name: Locate and Stage Generated APK
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -ls
          mkdir -p apk-output
          find . -name "*.apk" -exec cp -v {} apk-output/ \;
          echo "=== Contents of staged apk-output: ==="
          ls -la apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/*.apk
          if-no-files-found: error



