name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:clean :app:assembleDebug --no-build-cache --stacktrace --info

      - name: Locate and Stage Generated APK
        run: |
          echo "### Build Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== All .apk files found in workspace ===" >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -ls >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "=== Directory tree of app/build ===" >> $GITHUB_STEP_SUMMARY
          find app/build -maxdepth 4 -ls >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          mkdir -p apk-output
          find . -name "*.apk" -exec cp -v {} apk-output/ \; || true
          echo "=== Contents of staged apk-output: ==="
          ls -la apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/*.apk
          if-no-files-found: warn

      - name: Check APK Exists
        run: |
          count=$(find apk-output -name "*.apk" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No APK found in apk-output!"
            exit 1
          fi
          echo "SUCCESS: $count APK(s) found in apk-output:"
          ls -lh apk-output/*.apk

