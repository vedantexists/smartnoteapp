name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Report Build Failures
        run: |
          echo "=== GRADLE FAILURE DIAGNOSTICS ==="
          grep -E "(e: |ERROR:|> Task :app:.*FAILED|FAILURE:)" build.log | head -n 30 | while IFS= read -r line; do
            echo "::error title=CompileError::$line"
          done
          tail -n 25 build.log | while IFS= read -r line; do
            echo "::error title=BuildTail::$line"
          done
          if grep -q "BUILD FAILED" build.log; then
            exit 1
          fi

      - name: Locate and Stage Generated APK
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -ls
          mkdir -p apk-output
          find . -name "*.apk" -exec cp -v {} apk-output/ \;
          echo "=== Contents of staged apk-output: ==="
          ls -la apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/*.apk
          if-no-files-found: error



